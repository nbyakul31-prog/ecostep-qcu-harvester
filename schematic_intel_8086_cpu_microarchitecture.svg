<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background:#0f141d;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00e5ff"/>
    </marker>
  </defs>

  <!-- Precision CAD Grid -->
  <rect width="800" height="600" fill="url(#grid)" />

  <!-- Drawing Border & Title Block -->
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#ff3d00" stroke-width="2"/>
  <rect x="520" y="500" width="260" height="80" fill="#1e293b" stroke="#ff3d00" stroke-width="1.5"/>
  <text x="535" y="525" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">AUTOCAD SCHEMATIC: Intel 8086 CPU Microarchitecture</text>
  <text x="535" y="545" fill="#94a3b8" font-family="monospace" font-size="10">SCALE: 1:1 | UNITS: mm</text>
  <text x="535" y="565" fill="#00e5ff" font-family="monospace" font-size="10">BSIT HARDWARE PROTOTYPE</text>

  <!-- CPU Execution Unit (EU) Block -->
  <rect x="60" y="60" width="300" height="400" fill="rgba(0, 229, 255, 0.05)" stroke="#00e5ff" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="80" y="90" fill="#00e5ff" font-family="monospace" font-size="14" font-weight="bold">EXECUTION UNIT (EU)</text>

  <!-- ALU Box -->
  <rect x="90" y="120" width="240" height="80" fill="#1e293b" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="140" y="165" fill="#fff" font-family="monospace" font-size="14">ARITHMETIC LOGIC UNIT (ALU)</text>

  <!-- Registers (AX, BX, CX, DX) -->
  <rect x="90" y="230" width="240" height="120" fill="#1e293b" stroke="#ffd600" stroke-width="1.5"/>
  <text x="110" y="260" fill="#ffd600" font-family="monospace" font-size="12">GENERAL REGISTERS (AX, BX, CX, DX)</text>
  <text x="110" y="290" fill="#94a3b8" font-family="monospace" font-size="11">POINTERS: SP, BP | INDEX: SI, DI</text>
  <text x="110" y="320" fill="#94a3b8" font-family="monospace" font-size="11">FLAGS: ZF, CF, SF, OF, AF, PF</text>

  <!-- Bus Interface Unit (BIU) Block -->
  <rect x="420" y="60" width="320" height="400" fill="rgba(0, 230, 118, 0.05)" stroke="#00e676" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="440" y="90" fill="#00e676" font-family="monospace" font-size="14" font-weight="bold">BUS INTERFACE UNIT (BIU)</text>

  <!-- Segment Registers -->
  <rect x="450" y="120" width="260" height="100" fill="#1e293b" stroke="#00e676" stroke-width="1.5"/>
  <text x="470" y="150" fill="#00e676" font-family="monospace" font-size="12">SEGMENT REGISTERS (CS, DS, SS, ES)</text>
  <text x="470" y="180" fill="#94a3b8" font-family="monospace" font-size="11">INSTRUCTION POINTER (IP)</text>

  <!-- Bus Interconnect Line -->
  <line x1="330" y1="160" x2="450" y2="160" stroke="#00e5ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="355" y="150" fill="#00e5ff" font-family="monospace" font-size="10">INTERNAL BUS</text>
</svg>
